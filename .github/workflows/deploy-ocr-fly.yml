name: Deploy OCR sur Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'ocr-service/**'
      - '.github/workflows/deploy-ocr-fly.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Déployer le service OCR sur Fly.io
        run: cd ocr-service && flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
