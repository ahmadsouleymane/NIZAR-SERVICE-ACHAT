# Blueprint Render — Service OCR (PaddleOCR)
# Déploie automatiquement à chaque push sur la branche principale.
# Doc : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: service-achat-ocr
    runtime: python
    rootDir: ocr-service
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
